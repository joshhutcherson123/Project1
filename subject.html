<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<title>Môn học – Lumina</title>
</head>
<body>
<header class="app-top">
  <a class="logo" href="dashboard.html"><i></i>Lumina</a>
  <div class="who"><span id="email"></span><b class="badge" id="plan"></b><button class="btn" id="logout" type="button">Đăng xuất</button></div>
</header>
<main class="app-main">
  <p class="crumbs"><a href="dashboard.html">Trang học tập</a> / <span id="crumb"></span></p>
  <div class="sub-head" id="head"><h1 id="title"></h1><p>Chọn khối lớp, sau đó chọn bài để bắt đầu.</p></div>
  <div class="tabs" role="tablist" aria-label="Khối lớp" id="tabs"></div>
  <div id="chapters"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script src="lessons.js"></script>
<script>
(async () => {
const u = await Auth.requireUser();
  if (!u) return;
if (u) { document.getElementById('email').textContent = u.email; document.getElementById('plan').textContent = Auth.planName(u.plan); }
document.getElementById('logout').addEventListener('click', () => Auth.logout());

const q = new URLSearchParams(location.search);
const key = q.get('s'), S = SUBJECTS[key];
if (!S) { location.replace('dashboard.html'); return; }
document.title = S.name + ' – Lumina';
document.getElementById('crumb').textContent = S.name + ' · ' + S.en;
document.getElementById('title').textContent = S.name + ' · ' + S.en;
document.getElementById('head').classList.add(S.cls);

const grades = Object.keys(S.grades);
let grade = grades.includes(q.get('g')) ? q.get('g') : grades[0];
const tabs = document.getElementById('tabs'), box = document.getElementById('chapters');

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }

function render() {
  tabs.replaceChildren(); box.replaceChildren();
  grades.forEach(g => {
    const b = el('button', '', 'Lớp ' + g);
    b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', g === grade);
    b.addEventListener('click', () => { grade = g; history.replaceState(null, '', '?s=' + key + '&g=' + g); render(); });
    tabs.append(b);
  });
  S.grades[grade].forEach(c => {
    const sec = el('section', 'chapter');
    const h = el('h2', '', c.ch); h.append(el('small', '', c.vi)); sec.append(h);
    const ul = el('ul', 'lessons');
    c.items.forEach(i => {
      const li = el('li');
      const inner = i.body ? el('a') : el('div', 'soon');
      if (i.body) inner.href = 'lesson.html?s=' + key + '&g=' + grade + '&l=' + i.id;
      const left = el('span'); left.append(el('b', '', i.t), el('span', 'vi', i.vi));
      inner.append(left, el('span', i.body ? 'tag' : 'tag off', i.body ? 'Học ngay' : 'Sắp ra mắt'));
      li.append(inner); ul.append(li);
    });
    sec.append(ul); box.append(sec);
  });
}
render();
})();
</script>
</body>
</html>
