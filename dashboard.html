<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<title>Trang học tập – Lumina</title>
</head>
<body>
<header class="app-top">
  <a class="logo" href="dashboard.html"><i></i>Lumina</a>
  <div class="who">
    <span id="email"></span>
    <b class="badge" id="plan"></b>
    <button class="btn" id="logout" type="button">Đăng xuất</button>
  </div>
</header>
<main class="app-main">
  <h1 id="hello">Xin chào!</h1>
  <p class="lead">Chọn môn học để bắt đầu. Mỗi bài đều có thuật ngữ tiếng Anh kèm giải thích tiếng Việt.</p>
  <div class="grid3">
    <a class="card m" href="subject.html?s=math" style="text-decoration:none"><h3>Toán · Math</h3><p>Lớp 10, 11, 12</p></a>
    <a class="card p" href="subject.html?s=physics" style="text-decoration:none"><h3>Lý · Physics</h3><p>Lớp 10, 11, 12</p></a>
    <a class="card c" href="subject.html?s=chemistry" style="text-decoration:none"><h3>Hóa · Chemistry</h3><p>Lớp 10, 11, 12</p></a>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(async () => {
const u = await Auth.requireUser();
  if (!u) return;
if (u) {
  document.getElementById('hello').textContent = 'Xin chào, ' + u.name + '!';
  document.getElementById('email').textContent = u.email;
  document.getElementById('plan').textContent = u.plan === 'yearly' ? 'Gói năm' : 'Miễn phí';
}
if (u && u.plan !== 'yearly') {
  const up = document.createElement('a');
  up.className = 'btn solid'; up.href = 'payment.html'; up.textContent = 'Nâng cấp gói năm';
  document.getElementById('logout').before(up);
}
document.getElementById('logout').addEventListener('click', () => Auth.logout());
})();
</script>
</body>
</html>
