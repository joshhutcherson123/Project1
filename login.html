<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<title>Đăng nhập – Lumina</title>
</head>
<body>
<div class="auth-page">
  <aside class="auth-aside">
    <a class="logo" href="index.html"><i></i>Lumina</a>
    <div>
      <h2>Chào mừng bạn quay lại.</h2>
      <p>Tiếp tục bài học Toán, Lý, Hóa song ngữ từ nơi bạn đã dừng lại.</p>
    </div>
    <span></span>
  </aside>
  <main class="auth-main">
    <div class="auth-box">
      <a class="back" href="index.html">← Về trang chủ</a>
      <h1>Đăng nhập</h1>
      <p class="lead">Nhập email và mật khẩu để vào tài khoản của bạn.</p>
      <form id="form" novalidate>
        <div class="form-error" id="formError" role="alert" hidden></div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" autocomplete="email" required>
          <div class="err" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="password">Mật khẩu</label>
          <div class="pw">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" aria-pressed="false">Hiện</button>
          </div>
          <div class="err" aria-live="polite"></div>
        </div>
        <button class="btn solid" type="submit" id="submit">Đăng nhập</button>
      </form>
      <p class="switch">Chưa có tài khoản? <a href="register.html">Đăng Ký</a></p>
    </div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="auth.js"></script>
<script>
(async () => {
if (await Auth.requireGuest()) return;
bindPasswordToggle();
const f = document.getElementById('form'), email = f.email, pw = f.password;
const formError = document.getElementById('formError'), submit = document.getElementById('submit');
f.addEventListener('submit', async e => {
  e.preventDefault();
  formError.hidden = true;
  setError(email, emailOk(email.value) ? '' : 'Hãy nhập một địa chỉ email hợp lệ.');
  setError(pw, pw.value ? '' : 'Hãy nhập mật khẩu.');
  if (!emailOk(email.value) || !pw.value) return;
  submit.disabled = true; submit.textContent = 'Đang đăng nhập…';
  try {
    await Auth.login({email: email.value, password: pw.value});
    location.href = 'dashboard.html';
  } catch (err) {
    formError.textContent = err.message; formError.hidden = false;
    submit.disabled = false; submit.textContent = 'Đăng nhập';
  }
});
})();
</script>
</body>
</html>
